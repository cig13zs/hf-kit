<!doctype html>
<html lang="en" data-composition-variables='[{"id":"caption","type":"string","label":"Caption","default":"DAYS LEFT"},{"id":"changes","type":"string","label":"JSON [{t,value}]","default":"[{\"t\":0,\"value\":\"10\"},{\"t\":1.6,\"value\":\"9\"},{\"t\":3.2,\"value\":\"8\"},{\"t\":4.8,\"value\":\"7\"}]"},{"id":"badgeColor","type":"string","label":"Badge colour override","default":""}]'>
<body>
<template>
  <!-- Changing corner counter; challenge-spectacle Steal list: One progress device.
       Use for a countable long challenge; backfires if it stops changing for 5+ minutes.
       Variables: caption, changes JSON, badgeColor. -->
  <style>
    #root { position:relative; width:100%; height:100%; overflow:hidden; font-family:var(--hk-font-display,"Inter",system-ui,sans-serif); }
    #progress-badge-box { position:absolute; top:5%; right:5%; width:min(22%,360px); min-width:170px; aspect-ratio:1.65; border-radius:24px; background:var(--hk-accent,#ffd23f); color:var(--hk-bg,#0b0f14); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 12px 35px #0006; }
    #progress-badge-caption { width:90%; font-family:var(--hk-font-body,"Inter",system-ui,sans-serif); font-size:clamp(12px,1.4vmin,24px); font-weight:800; letter-spacing:.09em; text-align:center; text-transform:uppercase; }
    #progress-badge-values { position:relative; width:100%; height:58%; }
    .progress-badge-change { position:absolute; inset:0; display:grid; place-items:center; }
    .progress-badge-value { display:block; max-width:92%; font-size:clamp(42px,5vmin,82px); font-weight:800; line-height:1; overflow-wrap:anywhere; }
  </style>
  <div id="root" data-composition-id="progress-badge" data-start="0" data-width="1920" data-height="1080" data-duration="6">
    <div id="progress-badge-box"><div id="progress-badge-caption">DAYS LEFT</div><div id="progress-badge-values"></div></div>
  </div>
  <script>
    const vars = window.__hyperframes.getVariables();
    const box = document.getElementById("progress-badge-box");
    document.getElementById("progress-badge-caption").textContent = vars.caption;
    if (vars.badgeColor) box.style.background = vars.badgeColor;
    let changes;
    try { changes = JSON.parse(vars.changes); } catch { changes = []; }
    if (!Array.isArray(changes)) changes = [];
    changes = changes.filter(item => item && Number.isFinite(Number(item.t)) && Number(item.t) >= 0 && Number(item.t) < 6 && item.value !== undefined).sort((a,b) => Number(a.t) - Number(b.t));
    const values = document.getElementById("progress-badge-values");
    const tl = gsap.timeline({ paused:true });
    changes.forEach((item, i) => {
      const slot = document.createElement("div");
      const value = document.createElement("span");
      slot.className = "clip progress-badge-change";
      slot.id = `progress-badge-change-${i}`;
      slot.setAttribute("data-start", String(Number(item.t)));
      slot.setAttribute("data-duration", String((i + 1 < changes.length ? Number(changes[i + 1].t) : 6) - Number(item.t)));
      slot.setAttribute("data-track-index", "1");
      value.className = "progress-badge-value";
      value.textContent = String(item.value);
      slot.append(value);
      values.append(slot);
      tl.fromTo(value, { scale:1.4 }, { scale:1, duration:0.2, ease:"back.out" }, Number(item.t));
    });
    window.__timelines["progress-badge"] = tl;
  </script>
</template>
</body>
</html>
