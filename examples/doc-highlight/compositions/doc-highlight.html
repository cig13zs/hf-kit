<!doctype html>
<html lang="en" data-composition-variables='[{"id":"heading","type":"string","label":"Document heading","default":"ARCHIVE RECORD / 04"},{"id":"before","type":"string","label":"Text before highlight","default":"The committee reported that "},{"id":"highlight","type":"string","label":"Highlighted text","default":"the evidence was withheld"},{"id":"after","type":"string","label":"Text after highlight","default":" until the final hearing."},{"id":"highlightColor","type":"string","label":"Highlight colour override","default":""},{"id":"revealAt","type":"number","label":"Highlight start (s)","default":0.7}]'>
<body>
<template>
  <!-- Source document with one marked phrase; documentary Steal list: Highlighted source document.
       Use when a contested claim needs proof; backfires if the marked words do not match narration.
       Variables: heading, before, highlight, after, highlightColor, revealAt. -->
  <style>
    #root { position:relative; width:100%; height:100%; overflow:hidden; display:grid; place-items:center; background:var(--hk-bg,#0b0f14); font-family:var(--hk-font-body,"Inter",system-ui,sans-serif); }
    #doc-highlight-paper { width:min(78%,1200px); min-height:54%; padding:6%; box-sizing:border-box; background:var(--hk-paper,#f3efe4); color:var(--hk-bg,#0b0f14); box-shadow:0 24px 70px #0009; }
    #doc-highlight-heading { margin:0 0 1.5em; font-size:clamp(16px,1.8vmin,30px); font-weight:800; letter-spacing:.12em; }
    #doc-highlight-copy { margin:0; font-family:var(--hk-font-body,"Inter",system-ui,sans-serif); font-size:clamp(28px,4.4vmin,70px); line-height:1.32; }
    #doc-highlight-mark { position:relative; display:inline-block; }
    #doc-highlight-bar { position:absolute; inset:8% -1.5% 5%; display:block; background:var(--hk-negative,#ff4d4d); opacity:.7; transform-origin:left center; z-index:0; }
    #doc-highlight-mark-text { position:relative; z-index:1; }
  </style>
  <div id="root" data-composition-id="doc-highlight" data-start="0" data-width="1920" data-height="1080" data-duration="3">
    <div id="doc-highlight-paper" class="clip" data-start="0" data-duration="3" data-track-index="1"><p id="doc-highlight-heading">ARCHIVE RECORD / 04</p><p id="doc-highlight-copy"><span id="doc-highlight-before">The committee reported that </span><span id="doc-highlight-mark"><span id="doc-highlight-bar"></span><span id="doc-highlight-mark-text">the evidence was withheld</span></span><span id="doc-highlight-after"> until the final hearing.</span></p></div>
  </div>
  <script>
    const vars = window.__hyperframes.getVariables();
    document.getElementById("doc-highlight-heading").textContent = vars.heading;
    document.getElementById("doc-highlight-before").textContent = vars.before;
    document.getElementById("doc-highlight-mark-text").textContent = vars.highlight;
    document.getElementById("doc-highlight-after").textContent = vars.after;
    if (vars.highlightColor) document.getElementById("doc-highlight-bar").style.background = vars.highlightColor;
    const tl = gsap.timeline({ paused:true });
    tl.fromTo("#doc-highlight-paper", { yPercent:0 }, { yPercent:-2, duration:3, ease:"none" }, 0);
    tl.fromTo("#doc-highlight-bar", { scaleX:0 }, { scaleX:1, duration:0.25, ease:"power2.out" }, Number(vars.revealAt) || 0);
    window.__timelines["doc-highlight"] = tl;
  </script>
</template>
</body>
</html>
