<!doctype html>
<html lang="en" data-composition-variables='[{"id":"text","type":"string","label":"Label","default":"THE IMMUNE SYSTEM"},{"id":"actorColor","type":"string","label":"Actor colour override","default":""},{"id":"enterAt","type":"number","label":"Entrance (s)","default":0.2},{"id":"holdSeconds","type":"number","label":"Hold (s; 0 = auto)","default":0}]'>
<body>
<template>
  <!-- First-appearance pill; animated-explainer Steal list: Pill label on first appearance.
       Use for 3+ new terms or actors; backfires if labels linger after the first pass.
       Variables: text, actorColor, enterAt, holdSeconds. -->
  <style>
    #root { position:relative; width:100%; height:100%; overflow:hidden; font-family:var(--hk-font-body,"Inter",system-ui,sans-serif); }
    #pill-label-scene { position:absolute; inset:0; display:grid; place-items:center; }
    #pill-label-pill { display:inline-block; max-width:82%; padding:.42em .9em; border-radius:999px; background:var(--hk-side-a,#3be8ff); color:var(--hk-bg,#0b0f14); font-size:clamp(32px,5.2vmin,82px); font-weight:700; line-height:1.12; text-align:center; overflow-wrap:anywhere; transform-origin:center; }
  </style>
  <div id="root" data-composition-id="pill-label" data-start="0" data-width="1920" data-height="1080" data-duration="4.5">
    <div id="pill-label-scene" class="clip" data-start="0" data-duration="4.5" data-track-index="1"><span id="pill-label-pill">THE IMMUNE SYSTEM</span></div>
  </div>
  <script>
    const vars = window.__hyperframes.getVariables();
    const pill = document.getElementById("pill-label-pill");
    pill.textContent = vars.text;
    if (vars.actorColor) pill.style.background = vars.actorColor;
    const enter = Math.max(0, Number(vars.enterAt) || 0);
    const words = String(vars.text).trim().split(/\s+/).length;
    const hold = Number(vars.holdSeconds) > 0 ? Number(vars.holdSeconds) : Math.max(1.5, words * 0.35);
    const tl = gsap.timeline({ paused:true });
    tl.fromTo(pill, { scale:0.6, opacity:0 }, { scale:1, opacity:1, duration:0.2, ease:"back.out(1.7)" }, enter);
    tl.to(pill, { opacity:0, duration:0.15, ease:"power2.in" }, enter + 0.2 + hold);
    window.__timelines["pill-label"] = tl;
  </script>
</template>
</body>
</html>
