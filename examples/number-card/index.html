<!doctype html>
<html lang="en">
<head>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
body { margin:0; background:#0b0f14; }
#root { position:relative; width:100%; height:100%; overflow:hidden; --hk-bg:#0b0f14; --hk-ink:#f5f5f0; --hk-paper:#f3efe4; --hk-accent:#ffd23f; --hk-positive:#39ff6a; --hk-negative:#ff4d4d; --hk-side-a:#3be8ff; --hk-side-b:#ff7a3b; --hk-font-display:"Inter",system-ui,sans-serif; --hk-font-body:"Inter",system-ui,sans-serif; }
#archive-demo { position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(110deg,#545349,#9a8b6e 45%,#343b3e); filter:grayscale(1); color:#161616; font:800 8vmin Georgia,serif; letter-spacing:.08em; }

</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="3">

<div id="number-card-host" data-composition-id="number-card" data-composition-src="compositions/number-card.html" data-variable-values='{"number":"$25,000","label":"GRAND PRIZE","variant":"money"}' data-start="0" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>
</div>
