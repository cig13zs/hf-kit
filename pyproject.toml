[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hf-kit"
version = "0.1.0"
description = "Blocks, styles and tools for HyperFrames short-form video projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "jju1s" }]
keywords = ["hyperframes", "video", "shorts", "captions", "scaffolding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "numpy",
  "pillow",
]
optional-dependencies = { ocr = ["pytesseract"] }

[project.urls]
Homepage = "https://github.com/cig13zs/hf-kit"
Repository = "https://github.com/cig13zs/hf-kit"
Issues = "https://github.com/cig13zs/hf-kit/issues"

[project.scripts]
hf-kit-scaffold = "hf_kit.scaffold:main"
hf-kit-captions = "hf_kit.captions:main"
hf-kit-check = "hf_kit.check:main"
hf-kit-bg-source = "hf_kit.bg_source:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hf_kit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tools",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
