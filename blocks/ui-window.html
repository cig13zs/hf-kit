<!doctype html>
<html lang="en" data-composition-variables='[{"id":"title","type":"string","label":"Window title","default":"Evidence / Status"},{"id":"message","type":"string","label":"Typed message","default":"PROCESS COMPLETE"},{"id":"progress","type":"number","label":"Progress 0 to 1","default":0.8,"min":0,"max":1,"step":0.01},{"id":"accentOverride","type":"string","label":"Accent colour override","default":""}]'>
<body><template>
  <!-- Evidence window with title bar, stepped typing, and a progress bar.
  Source: animated-explainer Steal list, UI window as evidence; works for proof or process, backfires when decorative.
  Variables: title, message, progress, accentOverride. -->
  <style>
    #root { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; display:grid; place-items:center; background:var(--hk-bg,#0b0f14); color:var(--hk-ink,#f5f5f0); font-family:var(--hk-font-body,"Inter",system-ui,sans-serif); }
    .clip { position:absolute; inset:0; display:grid; place-items:center; }
    .window { width:min(78%,90vmin); border:1px solid #ffffff44; border-radius:1.4vmin; background:var(--hk-paper,#f3efe4); color:var(--hk-bg,#0b0f14); box-shadow:0 20px 60px #0008; overflow:hidden; }
    .titlebar { padding:2vmin 3vmin; border-bottom:1px solid #0002; font-weight:800; font-size:clamp(1rem,2.6vmin,2.4rem); }
    .body { padding:5vmin 4vmin 6vmin; }
    .typed { display:inline-block; max-width:100%; overflow:hidden; white-space:nowrap; font:800 clamp(1.4rem,4.3vmin,4rem)/1.2 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .track { margin-top:5vmin; width:100%; height:2.2vmin; min-height:10px; border-radius:999px; background:#0002; overflow:hidden; }
    .fill { display:block; width:100%; height:100%; background:var(--hk-accent,#ffd23f); transform-origin:left center; }
  </style>
  <div id="root" data-composition-id="ui-window" data-start="0" data-width="1920" data-height="1080" data-duration="5">
    <section id="ui-clip" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div id="ui-window" class="window"><div id="ui-title" class="titlebar">Evidence / Status</div><div class="body"><span id="ui-message" class="typed">PROCESS COMPLETE</span><div class="track"><i id="ui-fill" class="fill"></i></div></div></div>
    </section>
  </div>
  <script>
    (() => {
      const root=document.querySelector('#root');
      const { title,message,progress,accentOverride }=window.__hyperframes.getVariables();
      if (accentOverride) root.style.setProperty('--hk-accent',accentOverride);
      root.querySelector('#ui-title').textContent=title;
      const typed=root.querySelector('#ui-message');
      typed.textContent=message;
      const tl=gsap.timeline({ paused:true });
      tl.fromTo(root.querySelector('#ui-window'),{ y:40, autoAlpha:0 },{ y:0, autoAlpha:1, duration:0.4, ease:'power3.out' },0);
      tl.fromTo(typed,{ clipPath:'inset(0 100% 0 0)' },{ clipPath:'inset(0 0% 0 0)', duration:Math.max(1,message.length)*0.04, ease:`steps(${Math.max(1,message.length)})` },0.4);
      tl.fromTo(root.querySelector('#ui-fill'),{ scaleX:0 },{ scaleX:Math.max(0,Math.min(1,progress)), duration:1.2, ease:'power2.out' },0.4);
      window.__timelines['ui-window']=tl;
    })();
  </script>
</template></body></html>
