<!doctype html>
<html lang="en" data-composition-variables='[{"id":"beforeText","type":"string","label":"Before state","default":"PAPER"},{"id":"afterText","type":"string","label":"After state","default":"OBJECT"},{"id":"swapTime","type":"number","label":"Swap time in seconds","default":2.5,"min":0,"step":0.1},{"id":"frames","type":"number","label":"Blurred move frames","default":5,"min":4,"max":6,"step":1},{"id":"fps","type":"number","label":"Frames per second","default":30,"min":1,"step":1},{"id":"accentOverride","type":"string","label":"Object colour override","default":""}]'>
<body><template>
  <!-- A before/after replacement hidden at the peak of a 4-6-frame blur.
  Source: shorts-vfx Steal list, One-take look and Transformation on camera; works for magic reveals, backfires on information needing cutaways or a visible swap frame.
  Variables: beforeText, afterText, swapTime, frames, fps, accentOverride. -->
  <style>
    #root { position:absolute; inset:0; width:100%; height:100%; overflow:hidden; background:var(--hk-bg,#0b0f14); color:var(--hk-ink,#f5f5f0); font-family:var(--hk-font-display,"Inter",system-ui,sans-serif); font-weight:800; }
    .stage { position:absolute; inset:0; display:grid; place-items:center; background:var(--hk-paper,#f3efe4); }
    .state { position:absolute; width:58vmin; height:58vmin; max-width:75%; max-height:45%; display:grid; place-items:center; border:1.4vmin solid var(--hk-accent,#ffd23f); border-radius:2vmin; color:var(--hk-bg,#0b0f14); background:var(--hk-ink,#f5f5f0); font-size:clamp(2rem,6vmin,6rem); }
    .after { opacity:0; border-radius:50%; }
  </style>
  <div id="root" data-composition-id="blur-swap" data-start="0" data-width="1080" data-height="1920" data-duration="5">
    <section id="blur-clip" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div id="blur-stage" class="stage"><div id="blur-before" class="state before">PAPER</div><div id="blur-after" class="state after">OBJECT</div></div>
    </section>
  </div>
  <script>
    (() => {
      const root=document.querySelector('#root');
      const { beforeText,afterText,swapTime,frames,fps,accentOverride }=window.__hyperframes.getVariables();
      if (accentOverride) root.style.setProperty('--hk-accent',accentOverride);
      root.querySelector('#blur-before').textContent=beforeText;
      root.querySelector('#blur-after').textContent=afterText;
      const before=root.querySelector('#blur-before'), after=root.querySelector('#blur-after'), stage=root.querySelector('#blur-stage');
      const half=Math.max(4,Math.min(6,frames))/(2*fps);
      const tl=gsap.timeline({ paused:true });
      tl.fromTo(stage,{ filter:'blur(0px)' },{ filter:'blur(20px)', duration:half, ease:'none' },swapTime);
      tl.set(before,{ opacity:0 },swapTime+half);
      tl.set(after,{ opacity:1 },swapTime+half);
      tl.to(stage,{ filter:'blur(0px)', duration:half, ease:'none' },swapTime+half);
      window.__timelines['blur-swap']=tl;
    })();
  </script>
</template></body></html>
