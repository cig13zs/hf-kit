<!doctype html>
<html lang="en" data-composition-variables='[{"id":"number","type":"string","label":"Number","default":"$399"},{"id":"label","type":"string","label":"Label","default":"STARTING PRICE"},{"id":"variant","type":"enum","label":"Variant","default":"clean","options":[{"value":"clean","label":"Clean"},{"value":"money","label":"Money"}]},{"id":"accentColor","type":"string","label":"Money colour override","default":""}]'>
<body>
<template>
  <!-- Numeric proof card; tech-review Steal list: Numbers as cards, nothing else; challenge-spectacle Steal list: Outlined money type.
       Use for prices, benchmarks, wattage or a prize; backfires on non-numeric claims or every number.
       Variables: number, label, variant, accentColor. -->
  <style>
    #root { position:relative; width:100%; height:100%; overflow:hidden; font-family:var(--hk-font-display,"Inter",system-ui,sans-serif); }
    #number-card-scene { position:absolute; inset:0; display:grid; place-items:center; padding:5%; box-sizing:border-box; }
    #number-card-surface { display:flex; flex-direction:column; align-items:center; gap:clamp(10px,1.6vmin,22px); max-width:90%; padding:3% 5%; border-radius:28px; background:var(--hk-paper,#f3efe4); color:var(--hk-bg,#0b0f14); text-align:center; box-sizing:border-box; }
    #number-card-value { display:block; max-width:100%; font-size:clamp(58px,9vmin,96px); font-weight:800; line-height:1; overflow-wrap:anywhere; }
    #number-card-label { display:block; font-family:var(--hk-font-body,"Inter",system-ui,sans-serif); font-size:clamp(16px,1.85vmin,20px); font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    #root.money #number-card-surface { background:transparent; color:var(--hk-positive,#39ff6a); }
    #root.money #number-card-value { font-size:clamp(110px,20vmin,240px); -webkit-text-stroke:4px #0b2b10; paint-order:stroke fill; text-shadow:0 0 24px var(--hk-positive,#39ff6a); }
    #root.money #number-card-label { color:var(--hk-ink,#f5f5f0); font-size:clamp(20px,3vmin,34px); }
  </style>
  <div id="root" data-composition-id="number-card" data-start="0" data-width="1920" data-height="1080" data-duration="3">
    <div id="number-card-scene" class="clip" data-start="0" data-duration="3" data-track-index="1"><div id="number-card-surface"><span id="number-card-value">$399</span><span id="number-card-label">STARTING PRICE</span></div></div>
  </div>
  <script>
    const vars = window.__hyperframes.getVariables();
    const root = document.querySelector('#root');
    const surface = document.getElementById("number-card-surface");
    document.getElementById("number-card-value").textContent = vars.number;
    document.getElementById("number-card-label").textContent = vars.label;
    const tl = gsap.timeline({ paused:true });
    if (vars.variant === "money") {
      root.classList.add("money");
      if (vars.accentColor) root.style.setProperty("--hk-positive", vars.accentColor);
      tl.fromTo(surface, { scale:1.4 }, { scale:1, duration:0.25, ease:"power3.out", immediateRender:false }, 0);
    } else {
      tl.fromTo(surface, { y:20, opacity:0 }, { y:0, opacity:1, duration:0.4, ease:"power3.out", immediateRender:false }, 0);
    }
    window.__timelines["number-card"] = tl;
  </script>
</template>
</body>
</html>
